# ══════════════════════════════════════════════════
# ECH-Workerd - Deployment Parameters (Setup Wizard)
# ══════════════════════════════════════════════════

params:
  # ══════════════════════════════════════════════
  # 必填参数
  # ══════════════════════════════════════════════
  - id: proxy_server
    type: string
    name: "Proxy Server"
    description: "Backend proxy server address (host:port[/path])"
    default_value: ""
    optional: true
    placeholder: "example.com:443"

  # ══════════════════════════════════════════════
  # 身份验证
  # ══════════════════════════════════════════════
  - id: proxy_token
    type: string
    name: "Proxy Token"
    description: "Authentication token for the proxy server"
    default_value: ""
    optional: true

  # ══════════════════════════════════════════════
  # 安全配置
  # ══════════════════════════════════════════════
  - id: proxy_pin
    type: string
    name: "Admin Panel PIN"
    description: "PIN code for admin panel (4-32 chars, required to modify config after setup)"
    default_value: "12345"

  # ══════════════════════════════════════════════
  # SOCKS5 鉴权
  # ══════════════════════════════════════════════
  - id: proxy_socks5_user
    type: string
    name: "SOCKS5 Username"
    description: "SOCKS5 proxy username (optional)"
    default_value: ""
    optional: true

  - id: proxy_socks5_pass
    type: string
    name: "SOCKS5 Password"
    description: "SOCKS5 proxy password (requires username)"
    default_value: ""
    optional: true

  # ══════════════════════════════════════════════
  # 网络配置
  # ══════════════════════════════════════════════
  - id: proxy_server_ip
    type: string
    name: "Proxy Server IP"
    description: "Specify server IP directly to skip DNS resolution"
    default_value: "saas.sin.fan"
    optional: true

  # ══════════════════════════════════════════════
  # ECH 配置
  # ══════════════════════════════════════════════
  - id: proxy_dns
    type: string
    name: "DNS Server"
    description: "DoH server for ECH queries"
    default_value: "dns.alidns.com/dns-query"
    optional: true

  - id: proxy_ech_domain
    type: string
    name: "ECH Domain"
    description: "ECH (Encrypted Client Hello) query domain"
    default_value: "cloudflare-ech.com"
    optional: true

  # ══════════════════════════════════════════════
  # 分流配置
  # ══════════════════════════════════════════════
  - id: proxy_routing
    type: string
    name: "Routing Mode"
    description: "Traffic routing mode: global / bypass_cn / none"
    default_value: "global"
    optional: true

  # ══════════════════════════════════════════════
  # IP 列表配置
  # ══════════════════════════════════════════════
  - id: proxy_ipv4_file
    type: string
    name: "IPv4 List File"
    description: "Custom IPv4 list file path (leave empty for default)"
    default_value: ""
    optional: true
    placeholder: "/app/data/ipv4.txt"

  - id: proxy_ipv6_file
    type: string
    name: "IPv6 List File"
    description: "Custom IPv6 list file path (leave empty for default)"
    default_value: ""
    optional: true
    placeholder: "/app/data/ipv6.txt"

  - id: proxy_ipv4_url
    type: string
    name: "IPv4 List URL"
    description: "Custom IPv4 list download URL (leave empty for default)"
    default_value: ""
    optional: true

  - id: proxy_ipv6_url
    type: string
    name: "IPv6 List URL"
    description: "Custom IPv6 list download URL (leave empty for default)"
    default_value: ""
    optional: true

  - id: proxy_ip_auto_update
    type: bool
    name: "Auto Update IP List"
    description: "Force re-download IP list on every startup"
    default_value: false
    optional: true

  # ══════════════════════════════════════════════
  # GeoIP 数据库配置
  # ══════════════════════════════════════════════
  - id: proxy_geoip_enabled
    type: bool
    name: "Enable GeoIP"
    description: "Enable GeoIP database (works with IP list)"
    default_value: true
    optional: true

  - id: proxy_geoip_file
    type: string
    name: "GeoIP File Path"
    description: "GeoIP database path (leave empty for default)"
    default_value: ""
    optional: true
    placeholder: "/app/data/GeoLite2-City.mmdb"

  - id: proxy_geoip_url
    type: string
    name: "GeoIP Download URL"
    description: "GeoIP database download URL (leave empty for auto)"
    default_value: ""
    optional: true

  # ══════════════════════════════════════════════
  # 日志配置
  # ══════════════════════════════════════════════
  - id: proxy_log_level
    type: string
    name: "Log Level"
    description: "Logging verbosity: debug / info / warn / error"
    default_value: "info"
    optional: true

  - id: proxy_log_max_mb
    type: string
    name: "Log Max Size (MB)"
    description: "Maximum size of a single log file in MB"
    default_value: "100"
    optional: true

  - id: proxy_log_backup
    type: string
    name: "Log Backup Count"
    description: "Number of old log files to keep"
    default_value: "7"
    optional: true

  - id: proxy_log_compress
    type: bool
    name: "Compress Old Logs"
    description: "Compress old log files to save space"
    default_value: true
    optional: true

