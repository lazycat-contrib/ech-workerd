# ══════════════════════════════════════════════════
# ECH-Workerd - Runtime Manifest (LPK v2)
# 运行结构定义
# ══════════════════════════════════════════════════

application:
  subdomain: ech-workerd
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://host.lzcapp:30001/
services:
  ech-workerd:
    # upstream: docker.io/czyt/ech-workerd:v1.2.15
    image: docker.1ms.run/czyt/ech-workerd:v1.2.15
    network_mode: host
    user: root
    environment:
      - PROXY_SERVER={{.U.proxy_server}}
      - PROXY_TOKEN={{.U.proxy_token}}
      - PROXY_PIN={{.U.proxy_pin}}
      - PROXY_SOCKS5_USER={{.U.proxy_socks5_user}}
      - PROXY_SOCKS5_PASS={{.U.proxy_socks5_pass}}
      - PROXY_LISTEN=0.0.0.0:10808
      - PROXY_STATUS_ADDR=0.0.0.0:30001
      - PROXY_SERVER_IP={{.U.proxy_server_ip}}
      - PROXY_DNS={{.U.proxy_dns}}
      - PROXY_ECH_DOMAIN={{.U.proxy_ech_domain}}
      - PROXY_ROUTING={{.U.proxy_routing}}
      - PROXY_IP_LIST_DIR=/app/data
      - PROXY_IPV4_FILE={{.U.proxy_ipv4_file}}
      - PROXY_IPV6_FILE={{.U.proxy_ipv6_file}}
      - PROXY_IPV4_URL={{.U.proxy_ipv4_url}}
      - PROXY_IPV6_URL={{.U.proxy_ipv6_url}}
      - PROXY_IP_AUTO_UPDATE={{.U.proxy_ip_auto_update}}
      - PROXY_GEOIP_FILE={{.U.proxy_geoip_file}}
      - PROXY_GEOIP_URL={{.U.proxy_geoip_url}}
      - PROXY_GEOIP_ENABLED={{.U.proxy_geoip_enabled}}
      - PROXY_LOG_LEVEL={{.U.proxy_log_level}}
      - PROXY_LOG_FILE=/app/logs/proxy.log
      - PROXY_LOG_MAX_MB={{.U.proxy_log_max_mb}}
      - PROXY_LOG_BACKUP={{.U.proxy_log_backup}}
      - PROXY_LOG_COMPRESS={{.U.proxy_log_compress}}
    binds:
      - /lzcapp/var/logs:/app/logs
      - /lzcapp/var/data:/app/data
